<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHOP ANH VIN - Cửa hàng online</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f6f7fb;
    color:#222;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#ff4d6d,#ff7b54);
    color:white;
    padding:18px 6%;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:27px;
    font-weight:bold;
    white-space:nowrap;
}

.search{
    flex:1;
    max-width:550px;
    position:relative;
}

.search input{
    width:100%;
    padding:13px 20px;
    border:none;
    border-radius:30px;
    outline:none;
    font-size:15px;
}

.cart-button{
    background:white;
    color:#ff4d6d;
    border:none;
    padding:12px 18px;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

.cart-button:hover{
    transform:scale(1.05);
}

/* HERO */
.hero{
    margin:25px 6%;
    padding:55px 8%;
    border-radius:25px;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    overflow:hidden;
}

.hero h1{
    font-size:42px;
    margin-bottom:15px;
}

.hero p{
    font-size:18px;
    margin-bottom:25px;
}

.hero button{
    background:white;
    color:#ff4d6d;
    border:none;
    padding:14px 28px;
    border-radius:30px;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}

.hero-icon{
    font-size:130px;
}

/* CATEGORY */
.categories{
    padding:10px 6% 25px;
}

.categories h2{
    margin-bottom:15px;
}

.category-list{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.category{
    padding:10px 18px;
    border:1px solid #ddd;
    background:white;
    border-radius:25px;
    cursor:pointer;
    transition:.2s;
}

.category:hover,
.category.active{
    background:#ff4d6d;
    color:white;
}

/* PRODUCTS */
.products{
    padding:10px 6% 50px;
}

.products-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
}

.product{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
    transition:.25s;
}

.product:hover{
    transform:translateY(-6px);
    box-shadow:0 12px 25px rgba(0,0,0,.13);
}

.product-image{
    height:220px;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:90px;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-info{
    padding:18px;
}

.product-info h3{
    margin-bottom:8px;
    font-size:17px;
}

.product-info p{
    color:#777;
    font-size:14px;
    min-height:40px;
}

.price{
    color:#ff365f;
    font-size:20px;
    font-weight:bold;
    margin:13px 0;
}

.old-price{
    color:#999;
    text-decoration:line-through;
    font-size:13px;
    margin-left:5px;
}

.buy{
    width:100%;
    border:none;
    background:#ff4d6d;
    color:white;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

.buy:hover{
    background:#e93659;
}

/* CART */
.cart-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    z-index:2000;
}

.cart-overlay.show{
    display:block;
}

.cart{
    position:absolute;
    right:0;
    top:0;
    width:430px;
    max-width:100%;
    height:100%;
    background:white;
    padding:25px;
    overflow-y:auto;
}

.cart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    border:none;
    background:#eee;
    width:35px;
    height:35px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}

.cart-item{
    display:flex;
    gap:12px;
    border-bottom:1px solid #eee;
    padding:15px 0;
}

.cart-item-icon{
    width:65px;
    height:65px;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    border-radius:10px;
}

.cart-item-info{
    flex:1;
}

.cart-item-info h4{
    margin-bottom:5px;
}

.cart-price{
    color:#ff365f;
    font-weight:bold;
}

.quantity{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
}

.quantity button{
    width:27px;
    height:27px;
    border:1px solid #ddd;
    background:white;
    cursor:pointer;
    border-radius:5px;
}

.remove{
    color:#ff365f;
    border:none;
    background:none;
    cursor:pointer;
    font-size:13px;
}

.total{
    margin-top:25px;
    border-top:2px solid #eee;
    padding-top:20px;
}

.total-row{
    display:flex;
    justify-content:space-between;
    font-size:20px;
    font-weight:bold;
}

.checkout{
    width:100%;
    background:#ff4d6d;
    color:white;
    border:none;
    padding:15px;
    border-radius:10px;
    margin-top:20px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.empty{
    text-align:center;
    padding:50px 10px;
    color:#888;
}

/* FOOTER */
footer{
    background:#222;
    color:white;
    text-align:center;
    padding:35px 20px;
}

footer h2{
    margin-bottom:10px;
}

footer p{
    color:#bbb;
    margin:6px;
}

/* MOBILE */
@media(max-width:1000px){
    .product-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:750px){
    .header{
        flex-wrap:wrap;
    }

    .logo{
        width:100%;
        text-align:center;
    }

    .search{
        order:3;
        max-width:none;
        width:100%;
    }

    .hero{
        padding:35px 25px;
    }

    .hero h1{
        font-size:30px;
    }

    .hero-icon{
        font-size:70px;
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:480px){
    .product-grid{
        grid-template-columns:1fr;
    }

    .hero-icon{
        display:none;
    }

    .cart{
        width:100%;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <div class="header">

        <div class="logo">
            🛍️ ANH SHOP
        </div>

        <div class="search">
            <input
                type="text"
                id="searchInput"
                placeholder="🔎 Tìm kiếm sản phẩm..."
                oninput="searchProducts()"
            >
        </div>

        <button class="cart-button" onclick="openCart()">
            🛒 Giỏ hàng
            <span id="cartCount">0</span>
        </button>

    </div>
</header>


<!-- HERO -->
<section class="hero">

    <div>
        <h1>Siêu Sale Hôm Nay 🔥</h1>

        <p>
            Sản phẩm chất lượng - Giá tốt - Giao hàng tận nơi
        </p>

        <button onclick="scrollToProducts()">
            🛍️ Mua ngay
        </button>
    </div>

    <div class="hero-icon">
        🛒
    </div>

</section>


<!-- CATEGORY -->
<section class="categories">

    <h2>Danh mục</h2>

    <div class="category-list">

        <button class="category active"
                onclick="filterCategory('all',this)">
            Tất cả
        </button>

        <button class="category"
                onclick="filterCategory('fashion',this)">
            👕 Thời trang
        </button>

        <button class="category"
                onclick="filterCategory('phone',this)">
            📱 Điện thoại
        </button>

        <button class="category"
                onclick="filterCategory('beauty',this)">
            💄 Làm đẹp
        </button>

        <button class="category"
                onclick="filterCategory('accessory',this)">
            🎧 Phụ kiện
        </button>

    </div>

</section>


<!-- PRODUCTS -->
<section class="products" id="products">

    <div class="products-title">

        <h2>Sản phẩm nổi bật 🔥</h2>

        <span id="productCount"></span>

    </div>

    <div class="product-grid" id="productGrid"></div>

</section>


<!-- CART -->
<div class="cart-overlay" id="cartOverlay">

    <div class="cart">

        <div class="cart-header">

            <h2>🛒 Giỏ hàng</h2>

            <button class="close" onclick="closeCart()">
                ✕
            </button>

        </div>

        <div id="cartItems"></div>

        <div class="total">

            <div class="total-row">

                <span>Tổng cộng:</span>

                <span id="cartTotal">
                    0₫
                </span>

            </div>

            <button class="checkout" onclick="checkout()">
                💳 Tiến hành đặt hàng
            </button>

        </div>

    </div>

</div>


<!-- FOOTER -->
<footer>

    <h2>🛍️ ANH SHOP</h2>

    <p>Mua sắm dễ dàng - Giá tốt mỗi ngày</p>

    <p>📞 Hotline: 0900 123 456</p>

    <p>📧 Email: anhshop@gmail.com</p>

    <p>© 2026 ANH SHOP. All rights reserved.</p>

</footer>


<script>

/* =========================
   DANH SÁCH SẢN PHẨM
========================= */

const products = [

{
    id:1,
    name:"Áo thun Basic Premium",
    price:199000,
    oldPrice:299000,
    category:"fashion",
    icon:"👕",
    description:"Áo thun cotton cao cấp, mềm mại."
},

{
    id:2,
    name:"Áo Hoodie Unisex",
    price:349000,
    oldPrice:499000,
    category:"fashion",
    icon:"🧥",
    description:"Hoodie phong cách trẻ trung."
},

{
    id:3,
    name:"Điện thoại Smartphone X",
    price:6990000,
    oldPrice:7990000,
    category:"phone",
    icon:"📱",
    description:"Màn hình đẹp, hiệu năng mạnh."
},

{
    id:4,
    name:"Tai nghe Bluetooth Pro",
    price:599000,
    oldPrice:799000,
    category:"accessory",
    icon:"🎧",
    description:"Âm thanh chất lượng cao."
},

{
    id:5,
    name:"Son môi Luxury",
    price:299000,
    oldPrice:399000,
    category:"beauty",
    icon:"💄",
    description:"Son lì lâu trôi, màu thời thượng."
},

{
    id:6,
    name:"Nước hoa Premium",
    price:890000,
    oldPrice:1200000,
    category:"beauty",
    icon:"🌸",
    description:"Hương thơm sang trọng, quyến rũ."
},

{
    id:7,
    name:"Đồng hồ thời trang",
    price:1290000,
    oldPrice:1590000,
    category:"accessory",
    icon:"⌚",
    description:"Thiết kế sang trọng và hiện đại."
},

{
    id:8,
    name:"Giày Sneaker",
    price:799000,
    oldPrice:999000,
    category:"fashion",
    icon:"👟",
    description:"Sneaker năng động, dễ phối đồ."
}

];


/* =========================
   GIỎ HÀNG
========================= */

let cart = JSON.parse(localStorage.getItem("cart")) || [];


/* =========================
   HIỂN THỊ SẢN PHẨM
========================= */

function displayProducts(list = products){

    const grid = document.getElementById("productGrid");

    grid.innerHTML = "";

    document.getElementById("productCount").innerText =
        list.length + " sản phẩm";

    list.forEach(product => {

        grid.innerHTML += `

        <div class="product">

            <div class="product-image">

                ${product.icon}

            </div>

            <div class="product-info">

                <h3>${product.name}</h3>

                <p>${product.description}</p>

                <div class="price">

                    ${formatMoney(product.price)}

                    <span class="old-price">
                        ${formatMoney(product.oldPrice)}
                    </span>

                </div>

                <button class="buy"
                    onclick="addToCart(${product.id})">

                    🛒 Thêm vào giỏ

                </button>

            </div>

        </div>

        `;

    });

}


/* =========================
   THÊM VÀO GIỎ
========================= */

function addToCart(id){

    const product = products.find(p => p.id === id);

    const existing = cart.find(item => item.id === id);

    if(existing){

        existing.quantity++;

    }else{

        cart.push({
            ...product,
            quantity:1
        });

    }

    saveCart();

    updateCart();

    alert("✅ Đã thêm sản phẩm vào giỏ hàng!");

}


/* =========================
   HIỂN THỊ GIỎ
========================= */

function updateCart(){

    const container =
        document.getElementById("cartItems");

    const count =
        cart.reduce((sum,item) =>
            sum + item.quantity,0);

    document.getElementById("cartCount").innerText =
        count;

    if(cart.length === 0){

        container.innerHTML = `
            <div class="empty">
                🛒<br><br>
                Giỏ hàng đang trống
            </div>
        `;

    }else{

        container.innerHTML = "";

        cart.forEach(item => {

            container.innerHTML += `

            <div class="cart-item">

                <div class="cart-item-icon">
                    ${item.icon}
                </div>

                <div class="cart-item-info">

                    <h4>${item.name}</h4>

                    <div class="cart-price">
                        ${formatMoney(item.price)}
                    </div>

                    <div class="quantity">

                        <button onclick="changeQuantity(${item.id},-1)">
                            −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button onclick="changeQuantity(${item.id},1)">
                            +
                        </button>

                        <button class="remove"
                            onclick="removeItem(${item.id})">

                            Xóa

                        </button>

                    </div>

                </div>

            </div>

            `;

        });

    }

    const total =
        cart.reduce(
            (sum,item) =>
            sum + item.price * item.quantity,
            0
        );

    document.getElementById("cartTotal").innerText =
        formatMoney(total);

}


/* =========================
   TĂNG GIẢM SỐ LƯỢNG
========================= */

function changeQuantity(id,change){

    const item =
        cart.find(item => item.id === id);

    if(!item) return;

    item.quantity += change;

    if(item.quantity <= 0){

        cart =
            cart.filter(item => item.id !== id);

    }

    saveCart();

    updateCart();

}


/* =========================
   XÓA SẢN PHẨM
========================= */

function removeItem(id){

    cart =
        cart.filter(item => item.id !== id);

    saveCart();

    updateCart();

}


/* =========================
   TÌM KIẾM
========================= */

function searchProducts(){

    const keyword =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    const result =
        products.filter(product =>
            product.name
            .toLowerCase()
            .includes(keyword)
        );

    displayProducts(result);

}


/* =========================
   LỌC DANH MỤC
========================= */

function filterCategory(category,button){

    document
    .querySelectorAll(".category")
    .forEach(btn =>
        btn.classList.remove("active")
    );

    button.classList.add("active");

    if(category === "all"){

        displayProducts(products);

    }else{

        displayProducts(
            products.filter(
                product =>
                product.category === category
            )
        );

    }

}


/* =========================
   MỞ GIỎ
========================= */

function openCart(){

    document
    .getElementById("cartOverlay")
    .classList.add("show");

}


/* =========================
   ĐÓNG GIỎ
========================= */

function closeCart(){

    document
    .getElementById("cartOverlay")
    .classList.remove("show");

}


/* =========================
   ĐẶT HÀNG
========================= */

function checkout(){

    if(cart.length === 0){

        alert("🛒 Vui lòng thêm sản phẩm vào giỏ hàng!");

        return;

    }

    let message =
        "ĐƠN HÀNG ANH SHOP%0A%0A";

    cart.forEach(item => {

        message +=
            "• " +
            item.name +
            " x" +
            item.quantity +
            " - " +
            formatMoney(item.price * item.quantity) +
            "%0A";

    });

    const total =
        cart.reduce(
            (sum,item) =>
            sum + item.price * item.quantity,
            0
        );

    message +=
        "%0A💰 TỔNG: " +
        formatMoney(total);

    alert(
        "🎉 Đặt hàng thành công!%0A" +
        "Shop sẽ liên hệ với bạn."
    );

    /*
       SAU NÀY CÓ THỂ THAY BẰNG:
       - Zalo
       - Messenger
       - Email
       - Google Form
       - API thanh toán
    */

}


/* =========================
   FORMAT TIỀN
========================= */

function formatMoney(number){

    return number.toLocaleString("vi-VN") + "₫";

}


/* =========================
   LƯU GIỎ HÀNG
========================= */

function saveCart(){

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}


/* =========================
   SCROLL
========================= */

function scrollToProducts(){

    document
    .getElementById("products")
    .scrollIntoView({
        behavior:"smooth"
    });

}


/* =========================
   KHỞI ĐỘNG
========================= */

displayProducts();

updateCart();

</script>

</body>
</html>
